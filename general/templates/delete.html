<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>게시글 삭제 | mini-watch</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>게시글 삭제</h1>
    <p>「{{ post.title }}」을 삭제할까요?</p>
    <p>삭제한 글은 이 실습에서 되돌릴 수 없습니다.</p>
    <form action="/board/{{ post.id }}/delete" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit">삭제 확인</button>
    </form>
    <p><a href="/board/{{ post.id }}">취소</a></p>
</body>
</html>
