server {
    listen 80;
    location = /api/events {
        # 기록 수신은 내부 general-api에서만 호출한다.
        limit_except GET { deny all; }
        proxy_pass http://monitor-api:5000;
        proxy_set_header Host $http_host;
    }
    location /api/ {
        proxy_pass http://monitor-api:5000;
        proxy_set_header Host $http_host;
    }
    location / {
        proxy_pass http://monitor-web:3000;
        proxy_set_header Host $http_host;
    }
}
